spring:
    application:
        name: coviddata 
    datasource: 
        url: jdbc:postgresql://localhost:5432/cov19
        username: postgres
        hikari:
            auto-commit: true
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate: 
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect


eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/