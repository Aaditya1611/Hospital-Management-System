spring:
    application:
        name: coviddata 
    datasource: 
        url: jdbc:postgresql://postgres-db:5432/covid_db
        #url : jdbc:postgresql://localhost:5432/cov19
        username: postgres
        hikari:
            auto-commit: true
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate: 
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect


eureka:
  instance:
    hostname: covid-data-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
        #defaultZone: http://localhost:8761/eureka/

server:
  port: 8081