spring:
    application:
        name: auth
    datasource:
        #url: jdbc:postgresql://postgres-db:5432/auth_db
        url : jdbc:postgresql://localhost:5432/auth
        username: postgres
        driver-class-name: org.postgresql.Driver
    
    jpa:
        hibernate:
          ddl-auto: update
          naming:
            physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
            
    security:
        oauth2:
            client:
#                provider:
#                    oauth2-authorization.issuer-uri: http://localhost:8443/realms/Auth_api
#                registration:
#                    oauth2-authorization.client-id: oauth2-authorization
#                    oauth2-authorization.authorization-grant-type: authorization_code
#                    oauth2-authorization.redirect-uri: http://localhost:8080/login/oauth2/code/oauth2-authorization2
#                    oauth2-authorization.scope: openid,profile,roles,email
#                    oauth2-authorization.client-secret: 8AqKhksg1jFUDAId76iMPSXgTKLnGLDt
                registration:
                    google:
                        client-id: ${GOOGLE_ID}
                        client-secret: ${GOOGLE_SECRET}
                    github:
                        client-id: ${GITHUB_ID}
                        client-secret: ${GITHUB_SECRET}

eureka:
  instance:
    hostname: auth-service
    prefer-ip-address: true
  client:
    service-url:
       defaultZone: http://eureka-server:8761/eureka/
        #defaultZone: http://localhost:8761/eureka/

        
