spring:
    application:
        name: chatbot 
    datasource: 
        url: jdbc:postgresql://postgres-db:5432/chatbot_db
        username: postgres
        hikari:
            auto-commit: true
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate: 
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect


eureka:
  instance:
    hostname: chatbot-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/